<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Slt je t'ai préparé un site, clique quand t'as le temps</title>
<meta property="og:title" content="Slt je t'ai préparé un site, clique quand t'as le temps">
<meta property="og:description" content="(sa souvre sur téléphone tkt)">
<meta property="og:image" content="https://zamasubl4ck.github.io/Avcdelachance2/ouvre_stp_je_me_suis_fait_chier_a_faire/images/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg1:#1a1033;
    --bg2:#2d1b4e;
    --accent:#ff6b9d;
    --accent2:#ffd166;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.14);
    --text:#f5f3ff;
    --text-dim:#c9c2e0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:pan-y;
  }
  .bg-glow{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,107,157,0.18), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(255,209,102,0.14), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  .app{
    position:relative;z-index:1;
    height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .track{
    position:relative;
    width:100%;
    max-width:420px;
    height:min(560px, 78dvh);
  }
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:32px 26px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:28px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    transition:transform .5s cubic-bezier(.22,.9,.3,1), opacity .4s ease;
    opacity:0;
    transform:translateX(40px) scale(.96);
    pointer-events:none;
  }
  .slide.active{
    opacity:1;
    transform:translateX(0) scale(1);
    pointer-events:auto;
  }
  .slide.prev{
    opacity:0;
    transform:translateX(-40px) scale(.96);
  }
  .visual{
    width:118px;height:118px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:56px;
    margin-bottom:22px;
    background:linear-gradient(135deg, rgba(255,107,157,0.25), rgba(255,209,102,0.2));
    border:1px solid var(--card-border);
    overflow:hidden;
    flex-shrink:0;
  }
  .visual img{width:100%;height:100%;object-fit:cover;}
  .slide.outro{
    justify-content:flex-start;
    padding-top:34px;
    overflow-y:auto;
  }
  .slide.outro .visual{
    width:132px;height:152px;
    border-radius:16px;
    margin-bottom:18px;
  }
  .slide.outro p{
    text-align:left;
  }
  .badge{
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent2);
    font-weight:600;
    margin-bottom:8px;
  }
  h1{
    font-size:26px;
    margin:0 0 12px;
    font-weight:700;
    line-height:1.25;
  }
  p{
    font-size:16px;
    line-height:1.55;
    color:var(--text-dim);
    margin:0;
    white-space:pre-line;
  }
  .slide.outro{
    background:linear-gradient(160deg, rgba(255,107,157,0.14), rgba(255,209,102,0.08));
  }
  .slide.outro h1{font-size:24px;}
  .nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:26px;
    width:100%;
    max-width:420px;
  }
  .arrow{
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.07);
    color:var(--text);
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, opacity .2s ease;
    user-select:none;
  }
  .arrow:active{transform:scale(.9);}
  .arrow:hover{background:rgba(255,255,255,0.14);}
  .arrow[disabled]{opacity:.25;pointer-events:none;}
  .dots{
    display:flex;gap:8px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    transition:all .3s ease;
  }
  .dot.active{
    background:var(--accent);
    width:20px;
    border-radius:5px;
  }
  .hint{
    position:absolute;
    bottom:14px;left:0;right:0;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,0.35);
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="app">
  <div class="track" id="track"></div>
  <div class="nav">
    <button class="arrow" id="prevBtn" aria-label="Précédent">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="nextBtn" aria-label="Suivant">›</button>
  </div>
</div>

<div class="hint">glisse ou utilise les flèches</div>

<script>
/* ============================================================
   ✏️  MODIFIE ICI TES TEXTES / IMAGES — le reste du code, tu n'as
   pas besoin d'y toucher.

   Pour chaque "carte" (slide) tu peux régler :
   - badge   : petit texte au-dessus du titre (optionnel)
   - title   : le titre
   - text    : le texte (utilise \n pour aller à la ligne)
   - emoji   : emoji affiché si tu ne mets pas d'image
   - image   : (optionnel) chemin vers une photo, ex: "images/magellan.jpg"
               -> mets tes photos dans un dossier "images" à côté de ce
               fichier, puis remplace "image: null" par le chemin.
   - outro   : true uniquement pour la toute dernière carte (style différent)
   ============================================================ */

const SLIDES = [
  {
    title: "En 3 ans, il peut se passer beaucoup de choses",
    text: "Et voici des exemples 👉",
    emoji: "⏳",
    image: null
  },
  {
    badge: "2 ans et 11 mois",
    title: "Magellan",
    text: "A réalisé le premier tour du monde en bateau.",
    emoji: "🌍",
    image: "images/magellan.jpg"
  },
  {
    badge: "en seulement 3 ans",
    title: "Cristiano Ronaldo",
    text: "A remporté 3 Ligues des Champions et 3 Ballons d'Or.",
    emoji: "🏆",
    image: "images/ronaldo.jpg"
  },
  {
    badge: "3 ans",
    title: "Alexandre le Grand",
    text: "A conquis l'empire perse en 3 ans.",
    emoji: "👑",
    image: "images/alexandre.jpg"
  },
  {
    badge: "3 ans après ses débuts pro",
    title: "Mike Tyson",
    text: "Est devenu champion du monde des poids lourds.",
    emoji: "🥊",
    image: "images/tyson.jpg"
  },
  {
    text: "En 3 ans, beaucoup de choses peuvent changer.\n\nJ'avais forcé y'a 3 ans, et de manière générale c'était juste très gênant. Je vais pas tout débiter, mais sache juste que je me suis rendu compte pendant ces 3 années que t'es la seule personne à qui je pense vraiment, j'ai ressenti un truc proche de l'amour.\n\nJ'étais vraiment très mitigé à l'idée de te reparler, parce que bah techniquement ça montre que j'ai pas vraiment évolué par rapport au forcing. Après, j'en ai parlé avec ta cousine, et finalement je me suis dit : ça fait longtemps, on verra bien.",
    emoji: "💌",
    image: "images/rose.jpg",
    outro: true
  }
];

/* ============================================================
   À partir d'ici : moteur du carrousel, pas besoin d'y toucher.
   ============================================================ */

const track = document.getElementById('track');
const dotsWrap = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let current = 0;

SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (s.outro ? ' outro' : '');
  el.innerHTML = `
    <div class="visual">
      ${s.image ? `<img src="${s.image}" alt="">` : s.emoji || ''}
    </div>
    ${s.badge ? `<div class="badge">${s.badge}</div>` : ''}
    ${s.title ? `<h1>${s.title}</h1>` : ''}
    ${s.text ? `<p>${s.text}</p>` : ''}
  `;
  track.appendChild(el);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(dot);
});

const slideEls = [...track.children];
const dotEls = [...dotsWrap.children];

function render(){
  slideEls.forEach((el, i) => {
    el.classList.remove('active','prev');
    if(i === current) el.classList.add('active');
    else if(i < current) el.classList.add('prev');
  });
  dotEls.forEach((d,i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slideEls.length - 1;
}

function goTo(i){
  current = Math.max(0, Math.min(slideEls.length - 1, i));
  render();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(current + 1);
  if(e.key === 'ArrowLeft') goTo(current - 1);
});

// swipe support
let touchStartX = null;
track.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, {passive:true});
track.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){
    if(dx < 0) goTo(current + 1);
    else goTo(current - 1);
  }
  touchStartX = null;
}, {passive:true});

render();
</script>
</body>
</html>
